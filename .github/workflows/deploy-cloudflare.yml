name: Deploy screenerX to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [deploy/cloudflare-20261013]

permissions:
  contents: read

concurrency:
  group: screenerx-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate refresh recovery before deployment
        run: |
          pip install -r requirements.txt -r requirements-bot.txt
          python -m unittest tests.test_market tests.test_daily_refresh tests.test_agent tests.test_analysis_modes tests.test_telegram_bot tests.test_reporting_tables tests.test_idx_source tests.test_idx_screening tests.test_daily_digest tests.test_idx_mcp
        env:
          MPLBACKEND: Agg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/bot/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: workers/bot
      - name: Validate Worker
        run: npm run check && npm test
        working-directory: workers/bot
      - name: Build image and deploy Worker and Container
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/screenerx-deploy.log"
        working-directory: workers/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SCREENERX_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '016d4b7a71aa56787dec81605976ffd2'
      - name: Persist deployed image for container restarts
        run: python services/bot/finalize_image.py
        env:
          SCREENERX_DEPLOY_LOG: ${{ runner.temp }}/screenerx-deploy.log
          CLOUDFLARE_API_TOKEN: ${{ secrets.SCREENERX_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '016d4b7a71aa56787dec81605976ffd2'
