name: Deploy screenerX to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [deploy/cloudflare-20261013]

permissions:
  contents: read

concurrency:
  group: screenerx-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/bot/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: workers/bot
      - name: Validate Worker
        run: npm run check && npm test
        working-directory: workers/bot
      - name: Build image and deploy Worker and Container
        run: npx wrangler deploy
        working-directory: workers/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SCREENERX_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '016d4b7a71aa56787dec81605976ffd2'
